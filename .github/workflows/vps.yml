name: Full Root SSH Server
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup full root SSH server
        run: |
          # Установка SSH
          sudo apt update
          sudo apt install -y openssh-server

          # Порт 22 (стандартный) + запасной 8022
          sudo sed -i 's/#Port 22/Port 22\nPort 8022/' /etc/ssh/sshd_config

          # Полный root-доступ
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config

          # Отключаем проверку ключей для полного доступа
          echo "StrictModes no" | sudo tee -a /etc/ssh/sshd_config

          # Генерация случайного пароля
          PASSWORD=$(openssl rand -base64 16 | tr -d '=+/' | cut -c1-16)
          echo "root:$PASSWORD" | sudo chpasswd

          # Запуск SSH
          sudo systemctl start ssh

          # Получение IP
          IP=$(curl -s ifconfig.me)

          # Генерация SSH-ключа
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "root-full-access"
          PUBKEY=$(cat ~/.ssh/id_ed25519.pub)
          echo "$PUBKEY" | sudo tee -a /root/.ssh/authorized_keys

          # Разрешаем всё в sudo
          echo "root ALL=(ALL) ALL" | sudo tee -a /etc/sudoers

          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "✅ FULL ROOT SSH СЕРВЕР ГОТОВ"
          echo "═══════════════════════════════════════════════════════"
          echo "🌍 IP: $IP"
          echo "🔌 Порты: 22 и 8022"
          echo "👤 Логин: root"
          echo "🔑 Пароль: $PASSWORD"
          echo ""
          echo "📌 Команда для подключения:"
          echo "ssh root@$IP -p 22"
          echo "или"
          echo "ssh root@$IP -p 8022"
          echo ""
          echo "🔐 Публичный ключ (для входа без пароля):"
          echo "$PUBKEY"
          echo ""
          echo "💾 Сохрани ключ в файл: server-key.pub"
          echo "Добавь в Termux: cat server-key.pub >> ~/.ssh/authorized_keys"
          echo "═══════════════════════════════════════════════════════"

      - name: Keep alive
        run: sleep 360000
