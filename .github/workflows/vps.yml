name: VPS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install 3X-UI
        run: |
          wget -O install.sh https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh
          sudo bash install.sh
      - name: Expose terminal via browser
        run: |
          wget https://github.com/vi/websocat/releases/download/v1.12.0/websocat.x86_64-unknown-linux-musl
          chmod +x websocat.x86_64-unknown-linux-musl
          nohup ./websocat.x86_64-unknown-linux-musl -b tcp-listen:8080,reuseaddr -- ws-cat:websocat &
          curl ifconfig.me
