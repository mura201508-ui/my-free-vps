name: VPS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install 3X-UI and get URL
        run: |
          wget -O install.sh https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh
          sudo bash install.sh
      - name: Show panel access URL
        run: sudo x-ui settings | grep "Access URL"
