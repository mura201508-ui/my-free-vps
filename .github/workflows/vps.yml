name: VPS
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install WebSocket Terminal and show IP
        run: |
          # Устанавливаем websocat
          wget https://github.com/vi/websocat/releases/download/v1.12.0/websocat.x86_64-unknown-linux-musl
          chmod +x websocat.x86_64-unknown-linux-musl
          sudo mv websocat.x86_64-unknown-linux-musl /usr/local/bin/websocat

          # Запускаем веб-терминал
          nohup websocat -s 8080 --websocat-binary -- bash -l &

          # Ждём, пока сервер получит IP
          sleep 5

          # ВЫВОДИМ IP И ССЫЛКУ
          echo "========================================="
          echo "✅ ВАШ СЕРВЕР ГОТОВ!"
          echo "========================================="
          echo "🌍 IP адрес сервера:"
          curl -s ifconfig.me
          echo ""
          echo "🔗 Ссылка для веб-терминала (открыть в браузере):"
          echo "http://$(curl -s ifconfig.me):8080"
          echo "========================================="

      - name: Keep server alive
        run: sleep 360000
