name: VPS
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install WebSocket Terminal + SSH + 3X-UI
        run: |
          # 1. Веб-терминал
          wget -q https://github.com/vi/websocat/releases/download/v1.12.0/websocat.x86_64-unknown-linux-musl
          chmod +x websocat.x86_64-unknown-linux-musl
          sudo mv websocat.x86_64-unknown-linux-musl /usr/local/bin/websocat
          nohup websocat -s 8080 --websocat-binary -- bash -l &

          # 2. SSH на порту 443
          sudo apt update && sudo apt install -y openssh-server
          sudo sed -i 's/#Port 22/Port 443/' /etc/ssh/sshd_config
          echo "root:tempPass123" | sudo chpasswd
          sudo systemctl start ssh

          # 3. Установка 3X-UI (через sudo)
          sudo bash -c "$(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)"

          # Небольшая пауза, чтобы панель точно запустилась
          sleep 5

          # 4. Показываем всё (все команды с sudo)
          IP=$(curl -s ifconfig.me)
          echo ""
          echo "═══════════════════════════════════════════"
          echo "✅ СЕРВЕР ГОТОВ"
          echo "═══════════════════════════════════════════"
          echo "🌐 Веб-терминал: http://$IP:8080"
          echo "🔐 SSH: ssh root@$IP -p 443 (пароль: tempPass123)"
          echo "📊 3X-UI:"
          sudo x-ui settings | grep -E "(Access URL|username:|password:)" || echo "Панель настраивается, зайдите через веб-терминал и выполните: sudo x-ui settings"
          echo "═══════════════════════════════════════════"

      - name: Keep alive
        run: sleep 360000
