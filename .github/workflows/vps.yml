name: Free VPS

on:
  workflow_dispatch:    # Запуск по кнопке

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~6 часов максимум

    steps:
    - name: Получаем доступ к машине
      uses: actions/checkout@v4

    - name: Быстрая установка 3X-UI (Xray + VLESS)
      run: |
        # Ставим панель (скрипт от самого создателя панели)
        bash <(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh) --no-input

    - name: Открываем SSH доступ через tmate (это даст нам ссылку)
      uses: mxschmitt/action-tmate@v3
