name: VPS
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install 3X-UI and Diagnose
        run: |
          wget -O install.sh https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh
          sudo bash install.sh
          echo "=== DIAGNOSTIC START ==="
          echo "1. Checking processes listening on ports:"
          sudo netstat -tulnp | grep -E ':(80|443|54321|2053)'
          echo "2. Checking 3X-UI settings:"
          sudo x-ui settings
          echo "3. Checking public IP:"
          curl ifconfig.me
          echo "=== DIAGNOSTIC END ==="
