name: 3X-UI Auto Setup
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH + 3X-UI + VLESS
        run: |
          set -e  # Останавливаемся при любой ошибке

          echo "=== 1. Установка SSH ==="
          sudo apt update
          sudo apt install -y openssh-server

          sudo bash -c 'cat > /etc/ssh/sshd_config << EOF
Port 22
PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication no
EOF'

          PASSWORD=$(openssl rand -base64 12 | tr -d '=+/' | cut -c1-12)
          echo "root:$PASSWORD" | sudo chpasswd
          sudo systemctl restart ssh
          echo "✅ SSH готов (пароль: $PASSWORD)"

          echo "=== 2. Установка 3X-UI ==="
          sudo bash -c "$(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)"
          sleep 5
          echo "✅ 3X-UI установлен"

          echo "=== 3. Настройка панели ==="
          sudo x-ui setting -port 8080 -webBasePath "panel" -listenIP "0.0.0.0"
          sudo x-ui setting -username admin -password admin
          echo "✅ Панель настроена"

          echo "=== 4. Генерация ключей Reality ==="
          REALITY_OUTPUT=$(sudo x-ui generate reality-key)
          PRIVATE_KEY=$(echo "$REALITY_OUTPUT" | grep "Private key:" | awk '{print $3}')
          PUBLIC_KEY=$(echo "$REALITY_OUTPUT" | grep "Public key:" | awk '{print $3}')
          SHORT_ID=$(openssl rand -hex 8)
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "✅ Ключи сгенерированы"

          echo "=== 5. Создание VLESS inbound ==="
          sudo x-ui add-inbound --json "$(cat << EOI
{
  "remarks": "VLESS-Reality",
  "port": 443,
  "protocol": "vless",
  "settings": {
    "clients": [{"id": "$UUID", "flow": "xtls-rprx-vision"}],
    "decryption": "none"
  },
  "streamSettings": {
    "network": "tcp",
    "security": "reality",
    "realitySettings": {
      "dest": "www.microsoft.com:443",
      "serverNames": ["www.microsoft.com"],
      "privateKey": "$PRIVATE_KEY",
      "shortIds": ["$SHORT_ID"]
    }
  }
}
EOI
)"
          echo "✅ VLESS inbound создан"

          echo "=== 6. Сбор данных ==="
          IP=$(curl -s ifconfig.me)
          VLESS_LINK="vless://$UUID@$IP:443?encryption=none&flow=xtls-rprx-vision&security=reality&sni=www.microsoft.com&fp=chrome&pbk=$PUBLIC_KEY&sid=$SHORT_ID&type=tcp&headerType=none#GitHub-VLESS"

          echo ""
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo "✅ ВСЁ ГОТОВО!"
          echo "═══════════════════════════════════════════════════════════════════════════"
          echo ""
          echo "📡 SSH ДОСТУП:"
          echo "   IP: $IP"
          echo "   Порт: 22"
          echo "   Логин: root"
          echo "   Пароль: $PASSWORD"
          echo "   Команда: ssh root@$IP -p 22"
          echo ""
          echo "🌐 ПАНЕЛЬ 3X-UI:"
          echo "   http://$IP:8080/panel"
          echo "   Логин: admin"
          echo "   Пароль: admin"
          echo ""
          echo "🔗 ГОТОВАЯ СТРОКА VLESS (копируй и вставляй в клиент):"
          echo "$VLESS_LINK"
          echo ""
          echo "═══════════════════════════════════════════════════════════════════════════"

      - name: Keep alive
        run: sleep 360000
